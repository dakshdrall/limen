name: CI

on:
  push:
  pull_request:

# The deny-case suite is the load-bearing check here. If it goes red, the
# product claim — that a derived policy refuses everything adjacent to the
# observed flow — is false, and the build must not be green.

jobs:
  build:
    runs-on: ubuntu-latest

    # A real Postgres, because one fence in `@limen/db` cannot be proved by
    # reading. `audit_events` is append-only by GRANT rather than by trigger,
    # and the only way to see a privilege refused is to connect as the role it
    # constrains and try. `append-only.test.ts` skips with a printed notice on a
    # developer machine with no database and **fails** when `CI` is set — so
    # this service is not a convenience, it is what stops an unproven fence
    # going green on the run that gates a merge.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: limen
          POSTGRES_PASSWORD: limen
          POSTGRES_DB: limen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Here for exactly the reason the Postgres is. `contract.test.ts` and
      # `queue-redis.test.ts` both skip with a printed notice on a machine with
      # no Redis and **fail** when `CI` is set, so without this service the
      # at-least-once delivery claim would go unproven on the run that gates a
      # merge — which is the one run where an unproven fence matters.
      #
      # It also cannot be replaced by the in-memory implementation. A contract
      # suite that only ever ran against `MemoryKeyValue` would assert that the
      # fake agrees with itself, and the properties worth proving here —
      # `INCR`'s atomicity, `BLMOVE` leaving a job recoverable — are precisely
      # the ones a fake cannot establish.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The DIRECT connection string. There is no pooler in front of this
      # container, which matches how migrations are run everywhere else:
      # `drizzle.config.ts` and `scripts/migrate.mjs` both refuse a host
      # containing `-pooler`.
      MIGRATE_DATABASE_URL: postgresql://limen:limen@localhost:5432/limen
      TEST_DATABASE_URL: postgresql://limen:limen@localhost:5432/limen

      # Read by `packages/kv`'s contract suite and `apps/runtime`'s queue
      # suite. Both fail rather than skip when `CI` is set, so this is what
      # makes those suites run their real-service half at all.
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No explicit @limen/core build step: every workspace that imports
      # `@limen/core` by name has its own `prebuild` and `pretest` that build
      # it first, so whichever step runs earliest compiles core as its first
      # action.
      #
      # The core suite genuinely needs no build — it imports from `src`. The
      # web and chain suites do: `@limen/core`'s `exports` point at `dist/`,
      # which a fresh checkout has never produced. That distinction cost a red
      # build twice, because a warm `dist/` on a developer machine hides it
      # entirely.
      #
      # The second time is the instructive one. The comment here used to say
      # "apps/web has both a prebuild and a pretest", which was true and was
      # not the guarantee it sounded like: it made the build order a property
      # of which workspace happened to run first, and `packages/chain` — which
      # did not import core when this was written, and does now — sat ahead of
      # apps/web with a bare `vitest run`. `lower.test.ts` could not resolve
      # `@limen/core` and the job died three steps in. The rule is now per
      # workspace rather than per running order.
      - name: Test @limen/core (deny-case harness)
        run: npm run test -w @limen/core

      # The lowering harness. If this goes red, a proposal is being installed
      # onto the chain as something broader than what was derived and reviewed,
      # or a refusal that should have named its constraint did not. Neither is
      # visible from the core suite, which never looks at what installs.
      #
      # These tests reach no network. The testnet scripts that confirm the same
      # claims against a live host are deliberately not run here, for the same
      # reason the e2e suite is not: every run spends testnet funds.
      - name: Test @limen/chain (lowering, refusals, encodings)
        run: npm run test -w @limen/chain

      # Applied before the suite that reads them, so the append-only test has a
      # schema to be refused against. This step is also the only proof that the
      # committed migrations actually apply to an empty database — a migration
      # that has never been run is a file, not a schema.
      - name: Apply migrations to a fresh database
        run: npm run migrate -w @limen/db

      # The schema fences (no plaintext-secret column, no float near an amount,
      # nothing caching a claim about chain state) plus the three things a
      # transaction-mode pooler breaks. The last of those is the reason this job
      # has a Postgres at all and the reason that Postgres is not enough on its
      # own: it accepts session advisory locks, LISTEN/NOTIFY and named prepared
      # statements, all of which fail against Neon's pooled endpoint. The source
      # scan is what catches them; the container is what proves the grant.
      - name: Test @limen/db (schema fences, pooler portability, append-only)
        run: npm run test -w @limen/db

      # The KeyProvider, its production refusal, and the assertion that exactly
      # one module in the repository constructs one. That last is what makes
      # §7.5.3's promise — swapping the env-var master for a real KMS is a
      # module, not a refactor — checkable rather than aspirational.
      - name: Test @limen/custody (key wrapping, the mainnet fence, one construction site)
        run: npm run test -w @limen/custody

      # The shared store that retired the two process-local `TODO(roadmap)`s.
      # One contract suite runs against every implementation, so the in-memory
      # one used by `next dev` and the TCP one used by the runtime are held to
      # the same assertions rather than to two suites that drift apart. With the
      # service above it runs 35 cases; without it, 25 — and that difference is
      # the whole value of the service.
      - name: Test @limen/kv (the shared store, against a real Redis)
        run: npm run test -w @limen/kv

      # The process boundary §7.5.4 decided at M1. The loop's own decisions —
      # refusing an unknown job kind, settling a job whose handler threw,
      # recovering before reserving — are proved against a fake queue; the
      # delivery semantics that the durability argument rests on are proved
      # against the real Redis, because a mock agreeing with the design would
      # prove only that the design agrees with itself.
      - name: Test @limen/runtime (queue delivery, the worker loop, the startup refusal)
        run: npm run test -w @limen/runtime

      - name: Test @limen/web (extraction, ingest refusals, demo-signer fence)
        run: npm run test -w @limen/web

      # The landing page states counts — tests passing, transactions recorded,
      # deny axes refused on-ledger — and states them because a project that
      # quantifies its own evidence is checkable in a way that adjectives are
      # not. A hand-typed count rots, and a rotted number on a page about
      # honesty is worse than no number, so `evidence.json` is generated and
      # this step proves the committed copy still matches.
      #
      # It re-runs the three suites to do that, which is the one duplicated
      # cost in this workflow. The alternative — trusting the steps above to
      # have left a report behind — makes the guarantee depend on run order,
      # and a freshness check that can silently pass is not one.
      - name: Prove the landing's numbers are not stale
        run: npm run evidence:check

      - name: Lint
        run: npm run lint

      - name: Build @limen/web
        run: npm run build -w @limen/web

      # `shots:check` used to run at this point, guarding four generated product
      # screenshots against the hashes in `deployments/testnet.json` drifting
      # underneath them. The screenshots are gone — the V6 narrative argues in
      # live markup and inline SVG, which is selectable, reaches a screen reader,
      # and cannot go stale, so the images had no reader left and were strictly
      # the worse copy of what the page already renders.
      #
      # The one thing that script asserted about the *application* rather than
      # about its own PNGs was `assertNothingScrolls`. That moved into
      # `e2e/viewports.spec.ts` before the deletion, widened from the four crops
      # it used to run inside to every route — where it immediately found a
      # column overlap on the account detail screen that no shot could ever have
      # photographed.
      #
      # The browser step is now at the end of this job rather than here, and it
      # runs that check among others. It is last because the greps below are
      # near-instant and the browser suite is minutes: a bundle fence that has
      # broken should say so before a runner spends that time.

      # The demo signer is the only code in the repo that can move funds. It is
      # fenced by `import 'server-only'` and by a hard testnet throw, but both
      # of those are assertions about intent. This step is the proof.
      #
      # Two-sided on purpose: a grep that can never match would pass forever
      # while proving nothing, so the sentinel must first be found in the server
      # bundle before its absence from the client bundle means anything.
      - name: Prove the demo signer is absent from the client bundle
        env:
          SENTINEL: limen-demo-signer-8f2a41c6-server-only
        run: |
          set -euo pipefail

          if ! grep -rIq -- "$SENTINEL" apps/web/.next/server; then
            echo "::error::sentinel not found in the server bundle — this check is vacuous and proves nothing"
            exit 1
          fi
          echo "sentinel present in the server bundle; the negative check below is meaningful"

          if grep -rIl -e "$SENTINEL" -e 'LIMEN_DEMO_SECRET' apps/web/.next/static; then
            echo "::error::demo signer code or its secret's name reached the client bundle"
            exit 1
          fi
          echo "demo signer absent from the client bundle"

      # Level 3 of the mainnet gate. Levels 1 and 2 — the one-member passphrase
      # union in `lib/network.ts` and the hard throw in `@limen/chain`'s
      # `signAs` — are assertions the type checker and a unit test can make
      # about source. This step is the one that looks at what actually ships to
      # a browser that can now sign.
      #
      # Two-sided for the same reason the check above is: the testnet
      # passphrase must be *found* first, or the absence of the mainnet one is
      # the absence of any Stellar code at all and proves nothing. That failure
      # mode is not hypothetical here — the write path is loaded by dynamic
      # `import()` precisely so the read-only screens do not pay for the SDK,
      # and a bundling change that dropped it entirely would otherwise turn
      # this step green while removing the thing it guards.
      #
      # WHAT THIS DELIBERATELY DOES NOT ASSERT, and why nobody should "fix" it:
      #
      # PLAN-V4 §4 specified this level as "the mainnet passphrase string does
      # not appear in the client bundle at all". That is unachievable, and the
      # plan was written before it could be known: v4 puts the Stellar SDK in
      # the browser because there is no signing without it, and the SDK ships
      # its own `Networks` enum —
      #
      #     var e=((l=e||{}).PUBLIC="Public Global Stellar Network ; September 2015",
      #                     l.TESTNET="Test SDF Network ; September 2015",…
      #
      # — so the string is present in every build that can sign anything. A
      # check for its absence would fail forever, and the way that failure gets
      # resolved at 2am is by deleting the check. So the assertion is moved to
      # where it is both true and meaningful: Limen's own code never names
      # mainnet, and the bundle cannot address a mainnet endpoint. A passphrase
      # constant that nothing references and no endpoint to send it to is not a
      # path to mainnet; levels 1 and 2 are what make that structural.
      - name: Prove the client bundle can only reach testnet
        env:
          TESTNET: 'Test SDF Network ; September 2015'
          MAINNET: 'Public Global Stellar Network ; September 2015'
        run: |
          set -euo pipefail

          if ! grep -rIqF -- "$TESTNET" apps/web/.next/static; then
            echo "::error::testnet passphrase not found in the client bundle — this check is vacuous and proves nothing"
            exit 1
          fi
          echo "testnet passphrase present in the client bundle; the checks below are meaningful"

          # 1. Limen's own source never names mainnet. This is the assertion the
          #    plan was reaching for, made where the SDK's own constants cannot
          #    drown it out.
          #
          #    The self-match below is not testing grep. It is testing that the
          #    passphrase survived the trip through the environment intact —
          #    it contains spaces and a semicolon, and a quoting mistake here
          #    would silently search for something shorter, or for nothing, and
          #    report a clean bill of health either way.
          if ! printf '%s' "$MAINNET" | grep -qF -- "$MAINNET"; then
            echo "::error::the mainnet passphrase did not survive shell quoting — this check is broken, not passing"
            exit 1
          fi

          if grep -rIn --include='*.ts' --include='*.tsx' --include='*.mjs' \
               -F -- "$MAINNET" apps/web/src packages/*/src; then
            echo "::error::Limen source names the mainnet passphrase"
            exit 1
          fi
          echo "no Limen module names the mainnet passphrase"

          if grep -rIn --include='*.ts' --include='*.tsx' --include='*.mjs' \
               -E 'Networks\.PUBLIC' apps/web/src packages/*/src; then
            echo "::error::Limen source references Networks.PUBLIC"
            exit 1
          fi
          echo "no Limen module references Networks.PUBLIC"

          # 2. And the bundle cannot address mainnet even if it held the string.
          #    An endpoint is the part that cannot be borrowed from a library
          #    constant: to submit to mainnet a build has to know where it is.
          if ! printf 'horizon.stellar.org' | grep -qE 'horizon\.stellar\.org|mainnet\.sorobanrpc\.com'; then
            echo "::error::the mainnet endpoint pattern is broken, not passing"
            exit 1
          fi

          if grep -rIlE 'horizon\.stellar\.org|mainnet\.sorobanrpc\.com' apps/web/.next/static; then
            echo "::error::a mainnet endpoint reached the client bundle"
            exit 1
          fi
          echo "no mainnet endpoint in the client bundle"

      # A pasted secret key, caught without needing to know its value. The
      # local key is generated in the page and never leaves it, so no `S…`
      # StrKey should appear in shipped source at all; one that does is either
      # a hardcoded secret or a test fixture that escaped, and both are worth a
      # red build.
      #
      # This pattern can never match a correct bundle, which by the argument
      # above makes it worthless unless the pattern itself is shown to work. So
      # it is run against a known secret-shaped string first. That proves the
      # regex is live rather than quietly broken by a shell-quoting change.
      - name: Prove no secret key literal reached the client bundle
        env:
          # S + 55 base32 characters. Structurally a StrKey, deliberately not a
          # usable one — it exists only to fire the pattern.
          CANARY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        run: |
          set -euo pipefail

          if ! printf '%s' "$CANARY" | grep -qE '\bS[A-Z2-7]{55}\b'; then
            echo "::error::the StrKey pattern does not match a known StrKey — this check is broken, not passing"
            exit 1
          fi
          echo "StrKey pattern matches a known StrKey; the scan below is meaningful"

          if grep -rIlE '\bS[A-Z2-7]{55}\b' apps/web/.next/static; then
            echo "::error::something StrKey-shaped reached the client bundle"
            exit 1
          fi
          echo "no secret key literal in the client bundle"

      # The browser half, minus the half that costs money.
      #
      # `apps/web/playwright.config.ts` drives `account-lifecycle.spec.ts`, which
      # submits a real transaction to Stellar testnet on every run and rate-limits
      # itself to one per address per five minutes. That cannot be a per-push gate
      # and is not one. But the argument for keeping it out was being applied to a
      # whole directory on the strength of a shared `webServer`, and two suites in
      # `viewports.spec.ts` only ever read pages.
      #
      # So they got a server of their own. `playwright.ci.config.ts` boots `next
      # start` on 3001 with the RPC variables pinned empty, and selects by the
      # `@ci` tag rather than by filename or title — a renamed describe would drop
      # out of a title grep silently, and Playwright exits non-zero on a filter
      # that matches nothing, so removing the tag turns this red instead of empty.
      #
      # What it gates: no route pans the body sideways at 1280/1024/768/390, and
      # no table column is painted over by the one beside it. The second is the
      # reason this step exists — it found a live defect the first time anything
      # ran it, and until now it ran when somebody remembered.
      #
      # It reuses the `.next` built above rather than building its own.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check layout in a browser (overflow, column overlap)
        run: npm run e2e:ci -w @limen/web

      # Only on failure, and only the trace: a layout assertion that fires on a
      # runner is describing a paint nobody watching the log can see.
      - name: Upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Runs last so build and test results are always visible even when this
      # fails.
      #
      # Threshold is `low`, which is the strictest npm offers. It used to be
      # `moderate`, held there by 23 low-severity advisories that all reduced to
      # `elliptic` — an advisory covering every published version, so there was
      # no version to pin to and no override that could clear it. All 23 arrived
      # through `@creit.tech/stellar-wallets-kit`, which no source file ever
      # imported; dropping it took the count to zero and let the threshold move
      # down to where nothing has to be tolerated.
      #
      # The point of lowering it is that `moderate` silently permitted every
      # future low-severity advisory in order to tolerate one specific set. That
      # set is gone, so the permission should go with it.
      #
      # This gate exists so a future dependency bump cannot quietly reintroduce
      # an advisory at any severity. If it starts failing, fix the advisory or
      # move the threshold deliberately — do not silence it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
