name: CI

on:
  push:
  pull_request:

# The deny-case suite is the load-bearing check here. If it goes red, the
# product claim — that a derived policy refuses everything adjacent to the
# observed flow — is false, and the build must not be green.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No explicit @limen/core build step: apps/web has both a `prebuild` and
      # a `pretest` that build the core workspace first, so whichever apps/web
      # step runs earliest compiles core as its first action.
      #
      # The core suite genuinely needs no build — it imports from `src`. The
      # web suite does: `@limen/core`'s `exports` point at `dist/`, which a
      # fresh checkout has never produced. That distinction cost a red build
      # once, because a warm `dist/` on a developer machine hides it entirely.
      - name: Test @limen/core (deny-case harness)
        run: npm run test -w @limen/core

      # The lowering harness. If this goes red, a proposal is being installed
      # onto the chain as something broader than what was derived and reviewed,
      # or a refusal that should have named its constraint did not. Neither is
      # visible from the core suite, which never looks at what installs.
      #
      # These tests reach no network. The testnet scripts that confirm the same
      # claims against a live host are deliberately not run here, for the same
      # reason the e2e suite is not: every run spends testnet funds.
      - name: Test @limen/chain (lowering, refusals, encodings)
        run: npm run test -w @limen/chain

      - name: Test @limen/web (extraction, ingest refusals, demo-signer fence)
        run: npm run test -w @limen/web

      # The landing page states counts — tests passing, transactions recorded,
      # deny axes refused on-ledger — and states them because a project that
      # quantifies its own evidence is checkable in a way that adjectives are
      # not. A hand-typed count rots, and a rotted number on a page about
      # honesty is worse than no number, so `evidence.json` is generated and
      # this step proves the committed copy still matches.
      #
      # It re-runs the three suites to do that, which is the one duplicated
      # cost in this workflow. The alternative — trusting the steps above to
      # have left a report behind — makes the guarantee depend on run order,
      # and a freshness check that can silently pass is not one.
      - name: Prove the landing's numbers are not stale
        run: npm run evidence:check

      - name: Lint
        run: npm run lint

      - name: Build @limen/web
        run: npm run build -w @limen/web

      # The demo signer is the only code in the repo that can move funds. It is
      # fenced by `import 'server-only'` and by a hard testnet throw, but both
      # of those are assertions about intent. This step is the proof.
      #
      # Two-sided on purpose: a grep that can never match would pass forever
      # while proving nothing, so the sentinel must first be found in the server
      # bundle before its absence from the client bundle means anything.
      - name: Prove the demo signer is absent from the client bundle
        env:
          SENTINEL: limen-demo-signer-8f2a41c6-server-only
        run: |
          set -euo pipefail

          if ! grep -rIq -- "$SENTINEL" apps/web/.next/server; then
            echo "::error::sentinel not found in the server bundle — this check is vacuous and proves nothing"
            exit 1
          fi
          echo "sentinel present in the server bundle; the negative check below is meaningful"

          if grep -rIl -e "$SENTINEL" -e 'LIMEN_DEMO_SECRET' apps/web/.next/static; then
            echo "::error::demo signer code or its secret's name reached the client bundle"
            exit 1
          fi
          echo "demo signer absent from the client bundle"

      # Runs last so build and test results are always visible even when this
      # fails. Threshold is `moderate`, not `low`, because 23 low-severity
      # advisories are currently unfixable: they all reduce to `elliptic`,
      # whose advisory covers every published version, so there is no version
      # to pin to. See "Dependency advisories" in the README.
      #
      # This gate exists so a future dependency bump cannot quietly reintroduce
      # a high or critical. If it starts failing, fix the advisory or move the
      # threshold deliberately — do not silence it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
